<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafa samband</title>
</head>
<body>
    <header>
        <h1>Vefurinn minn</h1>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">Aðalsíða</a>
                </li>
                <li>
                    <a href="../um-mig.html">Um mig</a>
                </li>
                <li>
                    <a href="#">Hafa samband</a>
                </li>
            </ul>
        </nav>
        <hr>
    </header>

    <main>
        <section>
            <article>
                <h2>Hafa samband</h2>
                <p>Láttu mig endilega vita hvernig þér finnst síðan og hvað mætti breyta og betrumbæta!</p>
                <form action="hafa-samband.html" method="get">
                    <!-- Name -->
                    <label for="name">Nafn:</label>
                    <br>
                    <input id="name" type="text" size="30">

                    <!-- Email -->
                    <br>            
                    <label for="email">Tölvupóstur:</label>
                    <br>
                    <input id="email" type="email" size="30">
                    <br>

                    <!-- Message post -->
                    <label for="post">Skilaboð:</label>
                    <br>
                    <textarea name="post" id="post" cols="50" rows="10"></textarea>
                    <br>

                    <!-- Rating -->
                    <label for="rating">Síðan er:</label>
                    <select name="rating" id="rating">
                        <option value="">Góð</option>
                        <option value="">Betri</option>
                        <option value="">Best</option>
                    </select>
                    <br>

                    <!-- Mailing list -->
                    <label for="get-mail">Setja á póstlista:</label>
                    <input id="get-mail" type="checkbox">
                    <br>
                    <br>

                    <!-- Commit button -->
                    <button>Senda</button>
                </form>
        
                <p>Svo getur þú sent <a href="mailto:verkefni@ntv.is">póst</a> líka</p>
            </article>
        </section>
    </main>

    <footer>
        &copy; Unnar 2026
    </footer>
</body>
</html>
