<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafa samband</title>
</head>
<body>
    <header>
        <h1>Vefurinn minn</h1>
        <nav>
            <ul>
                <li>
                    <a href="../index.html">Aðalsíða</a>
                </li>
                <li>
                    <a href="../um-mig.html">Um mig</a>
                </li>
                <li>
                    <a href="#">Hafa samband</a>
                </li>
            </ul>
        </nav>
        <hr>
    </header>
    
    <main>
        <section>
            <article>
                <h2>Hafa samband</h2>
                <p>Þú getur sent tölvupóst á <a href="mailto:verkefni@ntv.is">verkefni@ntv.is</a> 
                eða hringt í mig í síma <a href="tel:8888888">888-8888</a>
                </p>
                <p>Láttu mig endilega vita hvernig þér finnst síðan og hvað mætti breyta og betrumbæta!</p>
                
                <!-- Form begins -->
                <form action="hafa-samband.html" method="get">
                    <!-- Name -->
                    <label for="name">Nafn:</label>
                    <br>
                    <input id="name" type="text" size="30" required>

                    <!-- Email -->
                    <br>            
                    <label for="email">Tölvupóstur:</label>
                    <br>
                    <input id="email" type="email" size="30" required>
                    <br>
                    
                    <!-- Numeric rating -->      
                    <label for="number-rating">Á skalanum 1-10 fær síðan:</label>
                    <br>
                    <input id="number-rating" type="number" min="1" max="10" value="1">
                    <br>

                    <!-- Message post -->
                    <label for="post">Skilaboð:</label>
                    <br>
                    <textarea name="post" id="post" cols="50" rows="10" required></textarea>
                    <br>
                    
                    <!-- Upload file -->
                    <label for="file-upload">Hlaða upp mynd:</label>
                    <input type="file" id="file-upload" accept=".jpg, .jpeg, .png, .webp">
                    <br>
                    
                    <!-- Rating dropdown -->
                    <label for="rating">Síðan er:</label>
                    <select name="rating" id="rating">
                        <option value="" selected>- Veldu -</option>
                        <option value="">Góð</option>
                        <option value="">Betri</option>
                        <option value="">Best</option>
                    </select>
                    <br>

                    <!-- Radio buttons for color -->
                    <label for="">Hver er uppáhalds liturinn þinn?</label>
                    <input type="radio" name="color" id="color-blue">
                    <label for="color-blue">Blár</label>
                    <input type="radio" name="color" id="color-yellow">
                    <label for="color-yellow">Gulur</label>
                    <input type="radio" name="color" id="color-azure">
                    <label for="color-azure">Azure</label>
                    <br>

                    <!-- Mailing list checkbox -->
                    <label for="get-mail">Setja á póstlista:</label>
                    <input id="get-mail" type="checkbox">
                    <br>
                    <br>
                    
                    <!-- Commit button -->
                    <button>Senda</button>
                </form>
                <br>
            </article>
        </section>
    </main>

    <footer>
        &copy; Unnar 2026
    </footer>
</body>
</html>
